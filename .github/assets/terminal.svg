<svg xmlns="http://www.w3.org/2000/svg" width="660" height="408">
  <style>
    /* Terminal card: same look as the qml-essentials code graphic. */
    body { padding: 22px; }

    .container {
      margin: auto;
      border-radius: 12px;
      box-shadow: 5px 5px 25px #111;
      font-family: ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,Liberation Mono,monospace;
      font-size: 14px;
      line-height: 1.45;
      color: #d4d4d4;
      background: #272a35;
    }

    /* window controls */
    .top { padding: 10px; }
    .button-l,.button-m,.button-r { display:inline-block;width:12px;height:12px;
                                    border-radius:50%;margin-left:5px; }
    .button-l { background:#ff5f56; }
    .button-m { background:#ffbd2e; }
    .button-r { background:#27c93f; }

    .content { padding: 0 18px 14px 18px; }
    .content p { margin: 0; }

    /* white-space:pre keeps the alignment of the real command output */
    .line { display:inline-block;white-space:pre;overflow:hidden;
            vertical-align:top;line-height:1.5;
            border-right:0.12em solid transparent; }
    .out  { opacity: 0; }

    /* syntax colours, matching the website scheme */
    .pr   { color:#27c93f; }
    .sh   { color:#7e869c; }
    .cmd  { color:#ffffff; }
    .mut  { color:#8b93a7; }
    .ok   { color:#2fb170; }
    .path { color:#447bdd; }
    .num  { color:#e15a46; }

    /* One keyframe set per line, expressed in percent of the 15.0s loop:
       typed lines animate their width in `ch` (hence the generated character
       counts), output lines fade in.  The finished frame is held until the
       cycle restarts, so a reader arriving late still sees the session play. */
    @keyframes type-l01{0%,0.0%{width:0;border-right-color:transparent;}0.01%{border-right-color:#d4d4d4;}4.0%{width:16ch;}4.01%,100%{width:16ch;border-right-color:transparent;}}
    @keyframes fade-l02{0%,4.53%{opacity:0;}6.27%,100%{opacity:1;}}
    @keyframes fade-l03{0%,6.8%{opacity:0;}8.53%,100%{opacity:1;}}
    @keyframes fade-l04{0%,9.07%{opacity:0;}10.8%,100%{opacity:1;}}
    @keyframes fade-l05{0%,11.33%{opacity:0;}13.07%,100%{opacity:1;}}
    @keyframes fade-l06{0%,13.6%{opacity:0;}15.33%,100%{opacity:1;}}
    @keyframes type-l08{0%,18.13%{width:0;border-right-color:transparent;}18.14%{border-right-color:#d4d4d4;}22.13%{width:6ch;}22.14%,100%{width:6ch;border-right-color:transparent;}}
    @keyframes fade-l09{0%,22.67%{opacity:0;}24.4%,100%{opacity:1;}}
    @keyframes type-l11{0%,27.2%{width:0;border-right-color:transparent;}27.21%{border-right-color:#d4d4d4;}31.2%{width:12ch;}31.21%,100%{width:12ch;border-right-color:transparent;}}
    @keyframes fade-l12{0%,31.73%{opacity:0;}33.47%,100%{opacity:1;}}
    @keyframes fade-l13{0%,34.0%{opacity:0;}35.73%,100%{opacity:1;}}
    @keyframes fade-l14{0%,36.27%{opacity:0;}38.0%,100%{opacity:1;}}
    .l01{width:0;animation:type-l01 15.0s steps(16,end) infinite;}
    .l02{animation:fade-l02 15.0s linear infinite;}
    .l03{animation:fade-l03 15.0s linear infinite;}
    .l04{animation:fade-l04 15.0s linear infinite;}
    .l05{animation:fade-l05 15.0s linear infinite;}
    .l06{animation:fade-l06 15.0s linear infinite;}
    .l08{width:0;animation:type-l08 15.0s steps(6,end) infinite;}
    .l09{animation:fade-l09 15.0s linear infinite;}
    .l11{width:0;animation:type-l11 15.0s steps(12,end) infinite;}
    .l12{animation:fade-l12 15.0s linear infinite;}
    .l13{animation:fade-l13 15.0s linear infinite;}
    .l14{animation:fade-l14 15.0s linear infinite;}
  </style>

  <foreignObject x="0" y="0" width="100%" height="100%">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <div class="container">
        <div class="top">
          <span class="button-l"></span>
          <span class="button-m"></span>
          <span class="button-r"></span>
        </div>
        <div class="content">
          <p>
            <span class="line typed l01"><span class="pr">$ </span><span class="cmd">make reproduce</span></span><br/>
            <span class="line out l02"><span class="mut">  lambda =  1.0   depth =    7   E = </span><span class="num">+0.7280</span></span><br/>
            <span class="line out l03"><span class="mut">  lambda =  5.0   depth =   35   E = </span><span class="num">+0.5562</span></span><br/>
            <span class="line out l04"><span class="mut">  wrote </span><span class="path">build/results/example_zne.csv</span><span class="mut">  (150 rows)</span></span><br/>
            <span class="line out l05"><span class="mut">  Wrote </span><span class="path">build/plots/example_zne.tex</span></span><br/>
            <span class="line out l06"><span class="ok">Reproduction up to date!</span></span><br/>
            <br/>
            <span class="line typed l08"><span class="pr">$ </span><span class="cmd">make</span></span><br/>
            <span class="line out l09"><span class="mut">Output written on </span><span class="path">build/paper/paper_template.pdf</span><span class="mut"> (1 page)</span></span><br/>
            <br/>
            <span class="line typed l11"><span class="pr">$ </span><span class="cmd">make check</span></span><br/>
            <span class="line out l12"><span class="ok">OK</span><span class="mut">    example_zne.csv</span></span><br/>
            <span class="line out l13"><span class="ok">OK</span><span class="mut">    example_zne_summary.csv</span></span><br/>
            <span class="line out l14"><span class="ok">All results match the committed reference.</span></span><br/>
          </p>
        </div>
      </div>
    </body>
  </foreignObject>
</svg>
