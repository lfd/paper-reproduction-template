services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: paper_repro
    logging:
      driver: "none"
    volumes:
      - ..:/workspace
      # Anonymous volume: keep the host's .venv out of the container, whose
      # dependencies are installed system-wide by the Dockerfile.
      - /workspace/.venv
    working_dir: /workspace
    stdin_open: true
    tty: true

  repro:
    image: paper_repro
    volumes:
      - ..:/workspace
      - /workspace/.venv
    working_dir: /workspace
    command: make reproduce
